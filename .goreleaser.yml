project_name: 'geoip2-csv-converter'
version: 2

builds:
  - id: 'geoip2-csv-converter'
    env:
      - 'CGO_ENABLED=0'
    flags:
      - '-trimpath'
    binary: 'geoip2-csv-converter'
    goos:
      - 'darwin'
      - 'linux'
      - 'windows'
    ignore:
      - goos: 'darwin'
        goarch: '386'

archives:
  - id: 'geoip2-csv-converter'
    ids:
      - 'geoip2-csv-converter'
    wrap_in_directory: true
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - 'CHANGELOG.md'
      - 'LICENSE'
      - 'README.md'

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ .Tag }}-next"

nfpms:
  - id: 'geoip2-csv-converter'
    ids:
      - 'geoip2-csv-converter'
    vendor: 'MaxMind, Inc.'
    homepage: 'https://www.maxmind.com/'
    maintainer: 'MaxMind, Inc. <support@maxmind.com>'
    description: 'Convert GeoIP and GeoLite CSVs to different formats.'
    license: 'Apache 2.0'
    formats:
      - 'deb'
      - 'rpm'
    contents:
      - src: CHANGELOG.md
        dst: /usr/share/doc/geoip2-csv-converter/CHANGELOG.md
      - src: LICENSE
        dst: /usr/share/doc/geoip2-csv-converter/LICENSE
      - src: README.md
        dst: /usr/share/doc/geoip2-csv-converter/README.md
